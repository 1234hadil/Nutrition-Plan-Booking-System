<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="../css/login.css">
    <title>Login</title>
</head>
<body>
<div class="left">
    <img src="../img/login.jfif" alt="Healthy Food">
</div> 

  <div class="right">
    <div class="login-box">
        <h1>WELCOME BACK!</h1>

        <div class="box">
            <input type="email" placeholder="Email">
        </div>

        <div class="box">
            <input type="password" placeholder="Password">
        </div>

        <div class="forgot">
            <a href="#">Forgot Password?</a>
        </div>

        <button class="login-btn">Login</button>

        <div class="or">OR</div>

        <div class="social">
            <button>Google</button>
            <button>Facebook</button>
        </div>

        <div class="signup">
            Don't have an account?
            <a href="#">Sign Up</a>
        </div>
    </div>
</div>

</body>
</html>
