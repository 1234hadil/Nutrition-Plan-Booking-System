<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
         <link rel="stylesheet" href="../css/sign.css">
    <title>Sign_up</title>
</head>
<body>
   <div class="left-box">
        <div class="overlay">
            <h1>Healthy Life Starts Here</h1>
            <p>Join our nutrition program and transform your lifestyle.</p>
        </div>
    </div>

    <div class="right-box">

        <h2>Client Sign Up</h2>

        <form>

            <div class="input-box">
                <label>Full Name</label>
                <input type="text" placeholder="Enter Full Name" required>
            </div>

            <div class="input-box">
                <label>Email</label>
                <input type="email" placeholder="Enter Email" required>
            </div>

            <div class="input-box">
                <label>Password</label>
                <input type="password" placeholder="Enter Password" required>
            </div>

            <div class="input-box">
                <label>Phone Number</label>
                <input type="tel" placeholder="Enter Phone Number" required>
            </div>

            <div class="input-box">
                <label>Choose Program</label>
                <select required>
                    <option value="">Select Program</option>
                    <option>Weight Loss</option>
                    <option>Mass Gain</option>
                    <option>Healthy Balance</option>
                    <option>Custom Plan</option>
                </select>
            </div>

            <div class="input-box">
                <label>Payment Method</label>
                <select required>
                    <option value="">Select Payment</option>
                    <option>Credit Card</option>
                    <option>PayPal</option>
                </select>
            </div>

            <button type="button" class="btn" onclick="checkForm()">Sign Up</button>
        </form>

    </div>


<script>

function checkForm() {

    let name = document.querySelector('input[type="text"]').value.trim();
    let email = document.querySelector('input[type="email"]').value.trim();
    let password = document.querySelector('input[type="password"]').value.trim();
    let phone = document.querySelector('input[type="tel"]').value.trim();

    if (name === "" || email === "" || password === "" || phone === "") {

        alert("Please fill all fields");
        return;
    }

    if (password.length < 6) {

        alert("Password must contain at least 6 characters");
        return;
    }

    if (isNaN(phone)) {

        alert("Phone number must contain only numbers");
        return;
    }

    window.location.href = "login.html";
}

</script>
</body>
</html>
